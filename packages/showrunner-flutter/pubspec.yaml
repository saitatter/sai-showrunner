name: showrunner_flutter
description: "ShowRunner desktop broadcaster automation application."
publish_to: 'none'

version: 2.1.0+3

environment:
  sdk: ^3.12.0

dependencies:
  flutter:
    sdk: flutter

  path: ^1.9.1
  crypto: ^3.0.3
  sai_nodes_core: 1.0.0
  ffi: ^2.1.3
  sai_nodes: 1.0.0
  flutter_svg: ^2.0.17
  yaml: ^3.1.3
  window_manager: ^0.5.1
  flutter_tts: 4.2.5
  flutter_webrtc: ^1.6.1
  media_kit: ^1.2.6
  media_kit_libs_audio: ^1.0.7
  tray_manager: ^0.5.3
  universal_ble: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  integration_test:
    sdk: flutter

  flutter_lints: ^6.0.0


flutter:

  uses-material-design: true

  fonts:
    - family: Inter var
      fonts:
        - asset: assets/fonts/Inter-roman.var.woff2
          weight: 400
        - asset: assets/fonts/Inter-italic.var.woff2
          style: italic
          weight: 400
    - family: Material Design Icons
      fonts:
        - asset: assets/fonts/materialdesignicons-webfont.ttf

  assets:
    - assets/app_icon.ico
    - assets/icons/obs.svg
    - assets/icons/discord.svg
    - assets/icons/advss.svg
    - assets/icons/aitum.svg
    - assets/overlay_widgets.generated.json
