# Copy to connections.local.yml; this file contains no real credentials.
# Run: ./scripts/test-live-nodes.ps1 -ConfigPath <path-to-local-yml>
# Only enabled scenarios run. Settings are written to an isolated temporary profile.
version: 1
enabled_plugins: [ShowRunner, http, time, random, variables, overlays]
plugin_settings:
  "heartrate":
    "autoConnect": false # Auto-connect preferred device
    "scanHeartRateOnly": true # Show heart-rate devices only
    "reconnectEnabled": true # Reconnect after disconnect
    "staleAfterMs": 3000 # Stale data timeout (ms)
    "batteryPollSeconds": 30 # Battery refresh interval (seconds)
    "preferredDeviceId": "" # Preferred device ID
    "preferredDeviceName": "" # Preferred device name
  "ShowRunner":
    "allowRemoteAccess": false # Allow OBS and HTTP access from the local network
    "port": 8181 # Internal Webserver Port
  "obs":
    "obsDefault": "" # Default OBS Connection
    "host": "127.0.0.1" # Host
    "port": 4455 # Port
    "password": "" # Password (SECRET)
  "aitum":
    "obsConnection": "" # OBS Connection
  "advss":
    "obsConnection": "" # OBS Connection
  "youtube":
    "clientId": "" # Client ID
    "clientSecret": "" # Client Secret (SECRET)
    "accessToken": "" # Access Token (SECRET)
    "refreshToken": "" # Refresh Token (SECRET)
    "liveChatId": "" # Live Chat ID
  "twitch":
    "clientId": "" # Client ID
    "clientSecret": "" # Client Secret (SECRET)
    "accessToken": "" # Access Token (SECRET)
    "broadcasterId": "" # Broadcaster ID
    "moderatorId": "" # Moderator ID
    "refreshToken": "" # Refresh Token (SECRET)
  "moderation":
    "enabled": "" # Enabled
    "apiBaseUrl": "" # API URL
    "apiToken": "" # API Token (SECRET)
    "dashboardWsUrl": "" # Dashboard WebSocket URL
    "forwardYouTube": true # Forward YouTube Chat
  "bluesky":
    "identifier": "" # Handle or DID
    "appPassword": "" # App Password (SECRET)
    "serviceUrl": "https://bsky.social" # Service URL
  "donordrive":
    "apiBase": "https://www.extra-life.org/api" # API Base URL
    "participantId": "" # Participant ID
    "pollIntervalSeconds": 15 # Poll Interval (seconds)
  "remote":
    "enabled": false # Enable remote HTTP server
    "host": "127.0.0.1" # Bind host
    "port": 8390 # Bind port
    "apiBase": "https://api.ShowRunner.io" # Remote dashboard API base URL
  "voicemod":
    "host": "127.0.0.1" # VoiceMod Hostname
    "port": 59129 # VoiceMod Port
  "sound":
    "globalVolume": 100 # Global Volume (0-100)
    "defaultOutput": "system.default" # Default Sound Output
  "govee":
    "apiKey": "" # Govee API Key (SECRET)
  "philips-hue":
    "hubIp": "" # Hue Hub IP
    "hubKey": "" # Hue Application Key (SECRET)
  "twinkly":
    "subnetMask": "255.255.255.255" # Subnet Mask
  "elgato":
    "host": "" # Device IP / Host
    "port": 9123 # Device Port
    "numberOfLights": 1 # Number of Lights
    "rgb": false # RGB / Light Strip
  "tplink-kasa":
    "host": "" # Device IP / Host
    "port": 9999 # Device Port
    "subnetMask": "255.255.255.255" # Discovery Subnet Mask
  "lifx":
    "host": "" # Device IP / Host
    "port": 56700 # LAN Port
    "target": "" # Target MAC (hex, optional)
    "subnetMask": "255.255.255.255" # Discovery Subnet Mask
  "wyze":
    "keyId": "" # Wyze Key ID (SECRET)
    "apiKey": "" # Wyze API Key (SECRET)
    "email": "" # Wyze Email
    "accessToken": "" # Access Token (SECRET)
    "refreshToken": "" # Refresh Token (SECRET)
# Resource references use these isolated IDs, not your production profile IDs.
resources: []
# Example OBS resource (add obs to enabled_plugins):
# - type: OBSConnection
#   id: qa-obs
#   config: {name: QA OBS, host: 127.0.0.1, port: 4455, password: ""}

