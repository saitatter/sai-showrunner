name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Setup Python
        uses: actions/setup-python@v6

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Install distutils compatibility
        run: pip install setuptools

      - name: Install dependencies without native builds
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Run tests
        run: yarn test

      - name: Run checks
        run: yarn check

      - name: Analyze and test Flutter migration
        shell: pwsh
        run: |
          Push-Location packages/showrunner-flutter
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --debug
          Pop-Location

      - name: Smoke Flutter Windows startup
        shell: pwsh
        run: .\scripts\smoke-flutter-windows.ps1 -Configuration Debug

      - name: Run overlay smoke tests
        run: yarn overlay:smoke

  scripts-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies without native builds
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Test semantic-release changelog expansion
        run: yarn test:semantic-release

  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install dependencies without native builds
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Semantic release dry run
        run: yarn release:dry-run
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
