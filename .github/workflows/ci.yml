name: CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  flutter-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Analyze, test, and build Flutter desktop app
        shell: pwsh
        run: |
          Push-Location packages/showrunner-flutter
          flutter pub get
          flutter analyze
          flutter test
          flutter build windows --debug
          Pop-Location

      - name: Smoke Flutter Windows startup
        shell: pwsh
        run: .\scripts\smoke-flutter-windows.ps1 -Configuration Debug

  browser-overlay:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install overlay dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Test browser overlay runtime
        run: yarn overlay:test

      - name: Build browser overlay runtime
        run: yarn overlay:build

  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install release tooling
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Semantic release dry run
        run: yarn release:dry-run
