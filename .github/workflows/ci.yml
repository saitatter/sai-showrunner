name: CI
on:
  workflow_call:
    inputs:
      ref:
        required: false
        type: string
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  windows-build:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
      - name: Install locked Flutter dependencies
        working-directory: packages/showrunner-flutter
        shell: pwsh
        run: |
          flutter pub get --enforce-lockfile
          if ($LASTEXITCODE -ne 0) { throw 'Flutter dependency resolution failed.' }
      - name: Build Flutter Windows debug and release
        working-directory: packages/showrunner-flutter
        shell: pwsh
        run: |
          flutter build windows --debug --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Debug build failed.' }
          flutter build windows --release --no-pub
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Smoke Flutter Windows startup
        shell: pwsh
        run: .\scripts\smoke-flutter-windows.ps1 -Configuration Debug
      - name: Verify Windows signing proof path
        shell: pwsh
        run: .\scripts\test-sign-flutter-windows.ps1 -BundlePath
          .\packages\showrunner-flutter\build\windows\x64\runner\Release
      - name: Smoke Flutter Windows release startup
        shell: pwsh
        run: .\scripts\smoke-flutter-windows.ps1 -Configuration Release
      - name: Smoke Flutter Windows updater classification
        shell: pwsh
        run: .\scripts\smoke-flutter-windows.ps1 -Configuration Release -Scenario updates
  windows-integration:
    runs-on: windows-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.47.7
          channel: stable
          cache: true
      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4
      - name: Setup Node.js for contract parity
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        shell: pwsh
        run: corepack enable
      - name: Install parity dependencies
        shell: pwsh
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Verify generated overlay registry
        shell: pwsh
        run: |
          yarn overlay:generate
          if ($LASTEXITCODE -ne 0) { throw "Native verification failed with exit code $LASTEXITCODE." }
          git diff --exit-code -- `
            packages/showrunner-obs-overlay/src/generated `
            packages/showrunner-flutter/assets/overlay_widgets.generated.json `
            packages/showrunner-flutter/lib/plugins/overlays/overlay_widget_catalog.generated.dart `
            packages/showrunner-flutter/lib/plugins/overlays/overlay_protocol.generated.dart `
            packages/showrunner-flutter/lib/plugins/remote/remote_protocol.generated.dart `
            libs/showrunner-overlay-core/src/generated
      - name: Analyze and test Flutter desktop app
        shell: pwsh
        run: ./scripts/ci-check.ps1 -Stage Flutter
      - name: Validate Flutter contract parity
        shell: pwsh
        run: ./scripts/ci-check.ps1 -Stage Parity
      - name: Run Flutter integration gate
        shell: pwsh
        run: ./scripts/test-flutter-integration.ps1 -CaptureDirectory '.tmp/visual/flutter'
      - name: Compare captured Flutter visual surfaces
        shell: pwsh
        run: |
          corepack yarn visual:compare:catalog --actual-root=.tmp/visual/flutter
          if ($LASTEXITCODE -ne 0) { throw "Visual comparison failed." }
          corepack yarn visual:regression --actual-root=.tmp/visual/flutter
          if ($LASTEXITCODE -ne 0) { throw 'Flutter visual regression failed.' }
      - name: Upload visual parity captures and diffs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: visual-parity-${{ runner.os }}
          path: |
            .tmp/visual/flutter/*.png
            .tmp/visual/catalog/*.png
            .tmp/visual/catalog/*.json
            .tmp/visual/regression/*
          if-no-files-found: warn
          retention-days: 14
      - name: Verify local version defaults
        run: node tools/verify-local-version.mjs
      - name: Verify overlay in a real Chromium browser
        shell: pwsh
        run: |
          corepack yarn overlay:build
          if ($LASTEXITCODE -ne 0) { throw 'Overlay build failed.' }
          corepack yarn overlay:browser-smoke
          if ($LASTEXITCODE -ne 0) { throw 'Browser DOM/WebGL smoke failed.' }
  test-windows:
    name: test-windows
    runs-on: ubuntu-latest
    needs:
      - windows-build
      - windows-integration
    if: ${{ always() }}
    steps:
      - name: Require all Windows gates to pass
        env:
          BUILD_RESULT: ${{ needs.windows-build.result }}
          INTEGRATION_RESULT: ${{ needs.windows-integration.result }}
        run: |
          test "$BUILD_RESULT" = success && test "$INTEGRATION_RESULT" = success
  scripts-ubuntu:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install overlay dependencies
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Verify documentation and local versions
        run: |
          node tools/check-docs.mjs
          node tools/verify-local-version.mjs
      - name: Test browser overlay runtime
        run: yarn overlay:test
      - name: Typecheck overlay packages
        run: yarn overlay:typecheck
      - name: Verify browser overlay has no Vue dependencies or components
        run: yarn overlay:verify-no-vue
      - name: Verify generated overlay registry
        run: >
          yarn overlay:generate

          git diff --exit-code -- packages/showrunner-obs-overlay/src/generated
          packages/showrunner-flutter/assets/overlay_widgets.generated.json
          libs/showrunner-overlay-core/src/generated
      - name: Build browser overlay runtime
        run: yarn overlay:build
  release-dry-run:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref || github.sha }}
          fetch-depth: 0
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock
      - name: Enable Corepack
        run: corepack enable
      - name: Install release tooling
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false
      - name: Preview manual release without mutations
        run: node tools/release/prepare.mjs --check
