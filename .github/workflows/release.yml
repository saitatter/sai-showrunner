name: Release

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.semantic-release.outputs.new_release_published || 'false' }}
      version: ${{ steps.semantic-release.outputs.new_release_version }}
      tag: ${{ steps.semantic-release.outputs.new_release_git_tag }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        run: corepack enable

      - name: Install release tooling
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Semantic release
        id: semantic-release
        uses: cycjimmy/semantic-release-action@v4
        with:
          semantic_version: 24
          extra_plugins: |
            @semantic-release/commit-analyzer
            @semantic-release/release-notes-generator
            @semantic-release/github
            conventional-changelog-conventionalcommits
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}

  package-windows:
    runs-on: windows-latest
    needs: release
    if: needs.release.outputs.released == 'true'
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.44.0'
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install browser overlay dependencies
        shell: pwsh
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Build browser overlay runtime
        shell: pwsh
        run: yarn overlay:build

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v2

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          $packageArgs = @(
            '-Version', '${{ needs.release.outputs.version }}',
            '-RequireBundledYouTubeClient'
          )
          $hasSigningCertificate = -not [string]::IsNullOrWhiteSpace($env:SHOWRUNNER_WINDOWS_SIGNING_CERTIFICATE_BASE64)
          $hasSigningPassword = -not [string]::IsNullOrWhiteSpace($env:SHOWRUNNER_WINDOWS_SIGNING_CERTIFICATE_PASSWORD)
          if ($hasSigningCertificate -xor $hasSigningPassword) {
            throw 'Windows signing requires both certificate and password secrets.'
          }
          if ($hasSigningCertificate) {
            $packageArgs += @('-SignWindowsBundle', '-RequireWindowsSignature')
            Write-Host 'Protected Windows signing secrets detected; running signed package and updater proof.'
          } else {
            Write-Host 'No Windows signing certificate configured; producing the documented unsigned archive.'
          }
          & .\scripts\package-flutter-windows.ps1 @packageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          SHOWRUNNER_YOUTUBE_CLIENT_ID: ${{ vars.SHOWRUNNER_YOUTUBE_CLIENT_ID }}
          SHOWRUNNER_YOUTUBE_CLIENT_SECRET: ${{ secrets.SHOWRUNNER_YOUTUBE_CLIENT_SECRET }}
          SHOWRUNNER_WINDOWS_SIGNING_CERTIFICATE_BASE64: ${{ secrets.SHOWRUNNER_WINDOWS_SIGNING_CERTIFICATE_BASE64 }}
          SHOWRUNNER_WINDOWS_SIGNING_CERTIFICATE_PASSWORD: ${{ secrets.SHOWRUNNER_WINDOWS_SIGNING_CERTIFICATE_PASSWORD }}
          SHOWRUNNER_WINDOWS_TIMESTAMP_URL: ${{ vars.SHOWRUNNER_WINDOWS_TIMESTAMP_URL }}

      - name: Upload Windows package
        shell: pwsh
        run: |
          $archive = Get-Item -LiteralPath ".\release\ShowRunner-Flutter-windows-${{ needs.release.outputs.version }}.zip"
          gh release upload "${{ needs.release.outputs.tag }}" $archive.FullName --clobber
          gh release edit "${{ needs.release.outputs.tag }}" --draft=false --latest
        env:
          GITHUB_TOKEN: ${{ secrets.RELEASE_PAT || secrets.GITHUB_TOKEN }}
