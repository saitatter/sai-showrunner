name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without v; empty derives it from conventional commits
        required: false
        type: string
      dry_run:
        description: Preview version and changelog without changing files, tags or releases
        required: false
        default: false
        type: boolean
      backfill_version:
        description: Rebuild assets of an existing Flutter release without changing its tag or publication state
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: showrunner-release
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    outputs:
      version: ${{ steps.plan.outputs.version }}
      tag: ${{ steps.plan.outputs.tag }}
      commit: ${{ steps.plan.outputs.commit }}
      build: ${{ steps.plan.outputs.build }}
      publish: ${{ steps.plan.outputs.publish }}
      ci_reuse: ${{ steps.ci.outputs.reuse }}
      native_desktop: ${{ steps.platforms.outputs.native_desktop }}
    steps:
      - name: Require trusted main
        env:
          RELEASE_REF: ${{ github.ref }}
        run: test "$RELEASE_REF" = refs/heads/main
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Preview version and notes
        id: plan
        env:
          REQUESTED_VERSION: ${{ inputs.version }}
          BACKFILL_VERSION: ${{ inputs.backfill_version }}
        run: |
          args=(--check --notes "$RUNNER_TEMP/release-notes.md")
          if [ -n "$REQUESTED_VERSION" ]; then args+=(--version "$REQUESTED_VERSION"); fi
          if [ -n "$BACKFILL_VERSION" ]; then args+=(--backfill "$BACKFILL_VERSION"); fi
          node tools/release/prepare.mjs "${args[@]}"
      - name: Inspect native desktop targets in the immutable snapshot
        id: platforms
        if: steps.plan.outputs.publish == 'true'
        env:
          PLANNED_COMMIT: ${{ steps.plan.outputs.commit }}
        run: |
          if git cat-file -e "$PLANNED_COMMIT:.github/actions/package-desktop/action.yml" 2>/dev/null; then
            echo 'native_desktop=true' >> "$GITHUB_OUTPUT"
          else
            echo 'native_desktop=false' >> "$GITHUB_OUTPUT"
          fi
      - name: Look for successful CI on the exact main commit
        id: ci
        if: steps.plan.outputs.publish == 'true' && !inputs.dry_run
        env:
          GH_TOKEN: ${{ github.token }}
          PLANNED_COMMIT: ${{ steps.plan.outputs.commit }}
        run: node tools/release/ci-proof.mjs

  validate:
    needs: plan
    if: needs.plan.outputs.publish == 'true' && !inputs.dry_run && needs.plan.outputs.ci_reuse != 'true'
    uses: ./.github/workflows/ci.yml
    with:
      ref: ${{ needs.plan.outputs.commit }}

  prepare:
    needs: [plan, validate]
    if: always() && needs.plan.result == 'success' && needs.plan.outputs.publish == 'true' && !inputs.dry_run && (needs.plan.outputs.ci_reuse == 'true' || needs.validate.result == 'success')
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - name: Verify existing GitHub release for backfill
        if: inputs.backfill_version != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
        run: gh release view "$RELEASE_TAG" --json tagName,isDraft,isPrerelease
      - name: Require release token for protected main
        if: inputs.backfill_version == ''
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
        run: |
          if [ -z "$RELEASE_TOKEN" ]; then
            echo '::error::Set RELEASE_TOKEN with permission to push the release commit to protected main. See docs/versioning-policy.md.'
            exit 1
          fi
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.commit }}
          fetch-depth: 0
          token: ${{ secrets.RELEASE_TOKEN || github.token }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Prepare, commit and tag the validated snapshot
        if: inputs.backfill_version == ''
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          EXPECTED_COMMIT: ${{ needs.plan.outputs.commit }}
          GH_TOKEN: ${{ github.token }}
        run: |
          git fetch origin main
          test "$(git rev-parse origin/main)" = "$EXPECTED_COMMIT"
          node tools/release/prepare.mjs --version "$RELEASE_VERSION" --notes "$RUNNER_TEMP/release-notes.md"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md package.json packages/showrunner-flutter/pubspec.yaml packages/showrunner-flutter/lib/services/update_check_service.dart
          git commit -m "chore(release): $RELEASE_VERSION"
          git tag -a "v$RELEASE_VERSION" -m "v$RELEASE_VERSION"
          git push --atomic origin HEAD:refs/heads/main "refs/tags/v$RELEASE_VERSION"
          args=(--draft --latest=false)
          if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease); fi
          gh release create "v$RELEASE_VERSION" --verify-tag --title "v$RELEASE_VERSION" --notes-file "$RUNNER_TEMP/release-notes.md" "${args[@]}"

  package-windows:
    runs-on: windows-latest
    environment: release
    permissions:
      contents: write
    needs: [plan, prepare]
    if: always() && needs.plan.result == 'success' && needs.prepare.result == 'success' && needs.plan.outputs.publish == 'true' && !inputs.dry_run
    steps:
      - name: Checkout released commit
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.7'
          channel: stable
          cache: true

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: yarn
          cache-dependency-path: yarn.lock

      - name: Enable Corepack
        shell: pwsh
        run: corepack enable

      - name: Install browser overlay dependencies
        shell: pwsh
        run: yarn install --immutable
        env:
          YARN_ENABLE_SCRIPTS: false

      - name: Build browser overlay runtime
        shell: pwsh
        run: yarn overlay:build

      - name: Setup NuGet
        uses: NuGet/setup-nuget@v4

      - name: Build and smoke-test Windows package
        shell: pwsh
        run: |
          $packageArgs = @{
            Version = $env:RELEASE_VERSION
            BuildNumber = [int]$env:RELEASE_BUILD
            RequireBundledYouTubeClient = $true
          }
          Write-Host 'Packaging unsigned Windows binaries and running application/updater proofs.'
          & .\scripts\package-flutter-windows.ps1 @packageArgs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        env:
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_BUILD: ${{ needs.plan.outputs.build }}
          SHOWRUNNER_YOUTUBE_CLIENT_ID: ${{ vars.SHOWRUNNER_YOUTUBE_CLIENT_ID }}
          SHOWRUNNER_YOUTUBE_CLIENT_SECRET: ${{ secrets.SHOWRUNNER_YOUTUBE_CLIENT_SECRET }}

      - name: Upload Windows package
        shell: pwsh
        run: |
          $archive = Get-Item -LiteralPath ".\release\ShowRunner-Flutter-windows-$env:RELEASE_VERSION.zip"
          gh release upload $env:RELEASE_TAG $archive.FullName --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Release asset upload failed.' }

        env:
          GITHUB_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          BACKFILL_VERSION: ${{ inputs.backfill_version }}

  package-desktop:
    needs: [plan, prepare]
    if: always() && needs.plan.result == 'success' && needs.prepare.result == 'success' && needs.plan.outputs.publish == 'true' && !inputs.dry_run && needs.plan.outputs.native_desktop == 'true'
    environment: release
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.plan.outputs.tag }}
      - uses: ./.github/actions/package-desktop
        with:
          version: ${{ needs.plan.outputs.version }}
          build: ${{ needs.plan.outputs.build }}
          require-client: 'true'
          youtube-client-id: ${{ vars.SHOWRUNNER_YOUTUBE_CLIENT_ID }}
          youtube-client-secret: ${{ secrets.SHOWRUNNER_YOUTUBE_CLIENT_SECRET }}
      - uses: actions/upload-artifact@v7
        with:
          name: release-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 14

  publish:
    needs: [plan, prepare, package-windows, package-desktop]
    if: always() && needs.plan.result == 'success' && needs.prepare.result == 'success' && needs.package-windows.result == 'success' && (needs.package-desktop.result == 'success' || (needs.plan.outputs.native_desktop == 'false' && inputs.backfill_version != '' && needs.package-desktop.result == 'skipped')) && !inputs.dry_run
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        if: needs.plan.outputs.native_desktop == 'true'
        with:
          pattern: release-*
          path: release
          merge-multiple: true
      - name: Upload desktop assets and publish the complete release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          BACKFILL_VERSION: ${{ inputs.backfill_version }}
          NATIVE_DESKTOP: ${{ needs.plan.outputs.native_desktop }}
        shell: bash
        run: |
          if [ "$NATIVE_DESKTOP" = true ]; then gh release upload "$RELEASE_TAG" release/* --clobber; fi
          if [ -z "$BACKFILL_VERSION" ]; then
            args=(--draft=false)
            if [[ "$RELEASE_VERSION" == *-* ]]; then args+=(--prerelease --latest=false); else args+=(--latest); fi
            gh release edit "$RELEASE_TAG" "${args[@]}"
          fi
