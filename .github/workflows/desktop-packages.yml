name: Desktop packages
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  packages:
    concurrency:
      group: desktop-package-${{ matrix.target }}-${{ github.event.pull_request.number || github.ref }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            target: linux-x64
          - runner: macos-15
            target: macos-arm64
          - runner: macos-15-intel
            target: macos-x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
      - name: Read source version
        id: version
        shell: bash
        run: |
          node --input-type=module -e 'import fs from "node:fs"; const v=JSON.parse(fs.readFileSync("package.json")).version; const build=fs.readFileSync("packages/showrunner-flutter/pubspec.yaml","utf8").match(/^version:.*\+(\d+)/m)[1]; fs.appendFileSync(process.env.GITHUB_OUTPUT,`version=${v}\nbuild=${build}\n`);'
      - name: Build native installer and portable packages
        uses: ./.github/actions/package-desktop
        with:
          phase: build
          version: ${{ steps.version.outputs.version }}
          build: ${{ steps.version.outputs.build }}
      - name: Verify native installer and portable packages
        uses: ./.github/actions/package-desktop
        with:
          phase: verify
          version: ${{ steps.version.outputs.version }}
          build: ${{ steps.version.outputs.build }}
      - uses: actions/upload-artifact@v7
        with:
          name: desktop-proof-${{ matrix.target }}
          path: release/*
          if-no-files-found: error
          retention-days: 7

      - name: Preserve package smoke diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: desktop-diagnostics-${{ matrix.target }}
          path: .tmp/desktop-proof-logs/*.log
          if-no-files-found: ignore
          retention-days: 7
