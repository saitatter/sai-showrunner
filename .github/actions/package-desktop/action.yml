name: Package native desktop
description: Build and smoke-test macOS and Linux installers and portable archives.
inputs:
  version:
    description: Release version without v.
    required: true
  build:
    description: Flutter build number.
    required: true
  require-client:
    description: Require a bundled YouTube client for a public release.
    default: 'false'
  youtube-client-id:
    description: Bundled desktop OAuth client ID.
    default: ''
  youtube-client-secret:
    description: Optional companion desktop client secret.
    default: ''
runs:
  using: composite
  steps:
    - name: Install Linux native dependencies
      if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y clang cmake ninja-build pkg-config libgtk-3-dev libstdc++-12-dev libayatana-appindicator3-dev libsecret-1-dev libjsoncpp-dev libmpv-dev libasound2-dev libpulse-dev gnome-keyring dbus-x11 xvfb openbox
    - uses: subosito/flutter-action@v2
      with:
        flutter-version: '3.47.7'
        channel: stable
        cache: true
    - uses: actions/setup-node@v7
      with:
        node-version: 22
        cache: yarn
        cache-dependency-path: yarn.lock
    - name: Install locked browser dependencies
      shell: bash
      env:
        YARN_ENABLE_SCRIPTS: 'false'
      run: |
        corepack enable
        yarn install --immutable
        yarn overlay:build
    - name: Install locked Flutter dependencies
      shell: bash
      working-directory: packages/showrunner-flutter
      run: flutter pub get --enforce-lockfile
    - name: Build installers and portable packages
      shell: bash
      env:
        PACKAGE_VERSION: ${{ inputs.version }}
        PACKAGE_BUILD: ${{ inputs.build }}
        REQUIRE_CLIENT: ${{ inputs.require-client }}
        SHOWRUNNER_YOUTUBE_CLIENT_ID: ${{ inputs.youtube-client-id }}
        SHOWRUNNER_YOUTUBE_CLIENT_SECRET: ${{ inputs.youtube-client-secret }}
      run: |
        args=(--version "$PACKAGE_VERSION" --build "$PACKAGE_BUILD")
        if [ "$REQUIRE_CLIENT" = true ]; then args+=(--require-client); fi
        python3 tools/release/package-desktop.py "${args[@]}"
    - name: Verify installed and portable macOS packages
      if: runner.os == 'macOS'
      shell: bash
      run: python3 tools/release/smoke-desktop.py
    - name: Verify installed and portable Linux packages
      if: runner.os == 'Linux'
      shell: bash
      run: |
        xvfb-run -a dbus-run-session -- bash -e -c '
          eval "$(printf "\n" | gnome-keyring-daemon --unlock --components=secrets)"
          export GNOME_KEYRING_CONTROL
          openbox > .tmp/openbox.log 2>&1 &
          python3 tools/release/smoke-desktop.py
        '
